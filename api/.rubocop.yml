inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "coverage/**/*"
    - "log/**/*"
    - "storage/**/*"
    - "db/schema.rb"

# コメントを書かない方針(CLAUDE.md)のため、ドキュメントコメントを要求しない
Style/Documentation:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Enabled: false


# ドメインのメッセージはエラー文言も含めコードに日本語で書く
Rails/I18nLocaleTexts:
  Enabled: false

# 委譲もメッセージとして明示的に定義する
Rails/Delegate:
  Enabled: false
